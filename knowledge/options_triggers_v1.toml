# 美股买方期权触发规则 v1 —— 预先登记（卡 A3，Opus，2026-10-22，看任何期权回测结果之前写死）
#
# 规则：本文件提交后不许为了回测好看而改。改任何一个数字 = 新版本 v2，v1 的结果照样要报，尝试次数累加。
# 回测只买不卖：最大亏损 = 付出的权利金。
# 成交：按当天 15:30–16:00（美东）窗口里最后一分钟的报价，买按卖价（ask）、卖按买价（bid），再加每张 $0.65 手续费 + 报价外 1% 滑点。
# 信号只用"当天收盘前已知"的数据：股票收盘价用当天 15:59 前的最后成交，均线/涨跌幅用之前的收盘。
#
# 样本：2024-01-02 → 最近一个交易日。
#   训练段 2024-01-02 → 2025-06-30（只看规则能不能跑通，不调参）
#   考试段 2025-07-01 → 最近（规则要在这一段扣全部成本后仍赚钱才算数）
# 尝试次数：4 条规则 × 8 个标的 = 32 次。显著性按 32 次多重检验校正（Bonferroni：单次 p < 0.05/32），
# 并且按"信号簇"（同一标的 5 个交易日内重复触发算 1 簇）计数，不按笔数。

[universe]
underlyings = ["SOXX", "SMH", "QQQ", "SPY", "NVDA", "AMD", "MU", "INTC"]
rates_proxy = "IEF"          # 7–10 年美债 ETF：价格创新低 ≈ 长端利率创新高

[contract]
# 选约：到期日取 30–45 天里离 38 天最近的；行权价取最接近 目标价 的那一档
target_dte = 38
min_dte = 30
max_dte = 45
put_strike_pct = 0.97        # 看跌：现价 × 0.97（略虚值）
call_strike_pct = 1.03       # 看涨：现价 × 1.03
max_spread_pct = 0.15        # 买卖价差 > 中间价 15% 的合约不买（太贵），当天不出手
budget_usd = 500             # 每笔花的权利金（回测统一口径；真钱另按风控上限）

[exit]
take_profit = 1.00           # 期权价格翻倍（+100%）卖
stop_loss = -0.50            # 亏一半卖
max_hold_days = 20           # 最多持有 20 个交易日
exit_dte = 7                 # 离到期 ≤ 7 天无条件卖
cooldown_days = 5            # 同一标的同一规则平仓后 5 个交易日内不再开

# ---------------------------------------------------------------- 4 条规则
[[rule]]
id = "R1_rates_breakdown_put"
side = "put"
why = "长端利率创新高压估值，高估值成长股/半导体先跌；价格已经跌破中期均线说明趋势确认，不是猜顶。"
when = [
  "IEF 收盘 = 近 60 个交易日最低",
  "标的收盘 < 50 日均线",
]

[[rule]]
id = "R2_trend_down_put"
side = "put"
why = "动量：中期趋势向下且近期加速下跌，大跌往往成串（这次半导体连跌 8 天就是例子）。"
when = [
  "标的收盘 < 50 日均线",
  "50 日均线比 10 个交易日前低",
  "近 20 个交易日涨跌幅 ≤ -5%",
]

[[rule]]
id = "R3_trend_up_call"
side = "call"
why = "动量的对称面：中期趋势向上且创 20 日新高，涨势延续。和 R2 一起测，防止只挑了下跌行情。"
when = [
  "标的收盘 > 50 日均线",
  "50 日均线比 10 个交易日前高",
  "收盘 = 近 20 个交易日最高",
]

[[rule]]
id = "R4_capitulation_rebound_call"
side = "call"
why = "超跌反弹：连续急跌后常有技术性反弹。和 R2 方向相反，回测会告诉我们大跌后该追空还是抄底。"
when = [
  "连续下跌 ≥ 5 个交易日",
  "近 10 个交易日涨跌幅 ≤ -8%",
]

# 过门槛（才进影子记账）：考试段扣全部成本后总盈亏 > 0；簇数 ≥ 10；校正后显著或至少 p < 0.1 且训练段同号；
# 最大连续亏损笔数、最大回撤一并报告。好得离谱（考试段每笔平均 > 权利金 50%）先当 bug 查。
