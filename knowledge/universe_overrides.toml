# 品种扩展（#13）手工覆盖表：desk/universe.py 的命名规则认不出、或认错的市场写在这里。
# 优先级：[exclude] > # ======================================================================================================
# ★ 待人工确认（2026-10-15 扫描里认不出的名字）。SKHY / DRAM 故意不写进 [markets]，scan 不会把它们当候选；
#   SKHX 查到了官方文档，已写进 [markets]，但仍请人工再核：
#
#   ★★ xyz:SKHX —— 这是全部候选里成交额最高的市场，最值得先确认。
#      2026-10-15 查 docs.trade.xyz/asset-directory/korea：SKHX = SK 海力士普通股（KRX 000660），
#      预言机 = 韩元价 ÷ 美元/韩元，时间表同 SMSN（周五 20:00 → 周一 09:01 首尔）。证据清楚，已写进下面 [markets]
#      为 kr_equity；但它就是 2026 年那次"价格异常、$59M 连环爆仓"的合约（trade.xyz 赔付），插针风险高，
#      model.decide_action 的插针否决对它尤其重要。上真钱前请人工再核一次。
#   xyz:SKHY —— 名字像 SK 海力士，但 trade.xyz 韩国资产页上没有这个代码；可能是另一个 dex 的同名/旧代码。待确认。
#   xyz:DRAM、io:DRAM —— 可能是存储芯片主题 ETF/篮子，也可能是别的东西；底层与时间表查不清。待确认。
#
# 和任务清单不一致、按官方文档处理的一条：
#   xyz:EWY —— 清单写的是 us_equity（EWY 是 NYSE Arca 上市的 iShares 韩国 ETF），但 docs.trade.xyz 把它列在
#   "Korea" 资产页、按韩国时段定价（ETF 净值，无外汇换算）。所以这里按 kr_equity。如果确认它其实按美股时段定价，
#   改成 "us_equity" 即可。io:EWY 是另一个 dex，按清单 us_equity。
# ======================================================================================================

