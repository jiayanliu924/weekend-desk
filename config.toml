[llm]
# 7.3 大语言模型抽取：只把文本变成事件表，不做任何价格判断
model = "claude-haiku-4-5-20251001"
prompt_version = "v0.1"
# 模型知识截止日（7.4 第三条：正式成绩只算截止日之后的周末）
knowledge_cutoff = "2025-03-01"
# 只抽取这个时间窗内收到的新闻（周五 16:00 至周日决策时刻），控制费用
window_start = "16:00"
max_items_per_run = 60
# 工作日也持续抽取（头条动量影子线、期权突发样本要用）：每隔多少分钟抽一次最近多少分钟收到的新闻。
# 周末窗口照旧；这里只是补上工作日的空档。设 continuous_every_min = 0 关闭。
continuous_every_min = 10
continuous_lookback_min = 90

[model]
# 7.1 主假设 H1：无实质新闻 → 偏离被抹掉；有实质新闻 → 偏离被确认
# 积累到 min_train 个周末前用 H1 原样规则；之后用线性模型（7.7 第 7–8 周）
min_train = 24
materiality_threshold = 2
feature_version = "f1"

[strategy]
# 主策略版本（2026-10-15，见 knowledge/lessons.md「实验室结果与 v2」）。
# v1 = 原 H1 规则（安静周末反向 / 信息周末顺向，门槛按链上 growthMode 费率）。
# v2 = 实验室走前挑选（wf_select）自己在美股单票上选中、样本外通过的那条：
#      只做 families_enabled 里的品种族；|偏离| > fade_threshold_bps 才反向；出手门槛按全额手续费；
#      停手：该品种族最近 stop_lookback_weekends 个已完成周末、按 v2 规则算的全额手续费盈亏之和 < 0 → 本周末不出手
#      （不足这么多周末 → 照常出手）。K=4 是事先写死的，不按回测结果调。
#      停手历史 = 账本正式周末 + 账本缺的日历周末用实验室同一套回补 K 线（15m 优先、退回 1h），和 strategy_lab 一致。
# 品种族：XYZ100/SP500 → us_index，BRENTOIL → metals_energy，SMSN → kr_equity，NVDA/TSLA/INTC → us_equity（desk/universe.classify）。
# 不管这里选哪个版本，v2 和 fade50_stocks（v2 去掉停手）两条影子每个周末都记。
version = "v2"
families_enabled = ["us_equity"]
fade_threshold_bps = 50
stop_lookback_weekends = 4
# 主策略是否用停手（2026-10-15 夜，17 只单票重跑实验室后改为 false）：
# 停手是看了 3 只单票"08-21 后反向转负"才加的；扩到 17 只后这个翻转不存在（反向>50 之前 +5.0、之后 +6.5 bps/笔），
# 样本外停手停了 5 个周末、错过 +$179，v2(含停手) 样本外 +$52 且靠 1–2 个周末（不通过），不停手的 反向>50 +$231 通过。
# 停手版本仍作为影子 v2 每周记账（用上面的 K=4），看实盘里它到底省钱还是错过钱。
primary_use_stop = false

[costs]
# 7.5 trade.xyz 基础费率（bps）。系统会读取链上 growthMode；开启时按 growth_discount 打折。
taker_bps = 9.0
maker_bps = 3.0
growth_discount = 0.9
# 交易门槛：预期收益至少超过成本这么多 bps 才模拟出手（7.5："只够容纳选择性出手"）
edge_buffer_bps = 2.0

[risk]
# 第八章（模拟单每个合约每周末 $1000 名义金额）
paper_notional_usd = 1000.0
capital_usd = 2000.0
max_depth_fraction = 0.10
rolling_weeks = 8
rolling_loss_limit = 0.15
eval_after_weekends = 30
# ↓ 借鉴竞品 Meridian/Keel 文档后新增（见 desk/mark.py、desk/model.py）
# 插针检测：中间价相对标记价偏离超过这么多 bps，判为盘口脱节，本周不出手（防 SK 海力士式被冤枉爆仓）
dislocation_bps = 25.0
# 插针比阈值：周末"最极端一刻 / 典型值"超过这个倍数，也判为瞬时插针，不出手
wick_ratio_veto = 6.0
# 首损上限：一笔最坏不良波动最多亏本金的这个比例（竞品"首损 ≤ 可吸收资本 25%"的小 bot 版，取更保守的 2%）
first_loss_frac = 0.02
# 估一笔最坏不良波动的下限（bps）；波动大的合约会用它实际见过的更大值
worst_adverse_bps = 500.0
# 信心仓位缩放区间：信号远超门槛时最多放大到 2 倍，勉强过线时缩到 0.5 倍
conf_min = 0.5
conf_max = 2.0
# 7 个合约可能被同一个周一宏观事件同时推同向；联合压测把它们当完全相关，总首损不超过本金这个比例
joint_first_loss_frac = 0.25

[live]
# 7.7 第 9–12 周的极小资金实盘。按备忘第八章：实盘前须律师书面确认主体与账户结构。
enabled = false
lawyer_confirmed = false
# 至少跑满多少个"运行干净"的模拟周末才允许实盘（备忘原文为 8 周；实盘阶段目的是验证成交与滑点）
min_paper_weekends = 3

[options]
# 第九章 第二阶段：加密期权的事件波动率研究。只做研究，不做市，不卖期权，不下单。
enabled = true
# 采集的币种（2026-10-12 起加 ETH）。第一个是主币种：账本/纸面交易只用它，流名沿用 drb_opts/drb_index/drb_dvol；
# 其余币种各自存到 drb_opts_eth / drb_index_eth / drb_dvol_eth。`currency` 保留做兼容。
currencies = ["BTC", "ETH"]
currency = "BTC"
# Deribit 公开行情（免费，无需账户）
poll_every_sec = 300
index_every_sec = 60
# 只保存 10 天内到期、行权价在现价 ±10% 以内的期权，控制磁盘
max_expiry_days = 10
moneyness_band = 0.10
# 事件前多少分钟锁定预测；观察窗口多长
event_lead_min = 60
window_hours = 24
# 每天这个时间（UTC，Deribit 每日到期时刻）锁定一次"对照组"预测
daily_lock_utc = "08:00"
# 抽取事件意外程度：事件后多少小时内收到的新闻
surprise_hours = 3
# 预测模型：某类样本攒够多少个后改用该类历史均值
min_history = 5
# 多少个正式事件后判断假设
eval_after_events = 20

[options.paper]
# 纸面期权交易员（11a）：每次锁定同时模拟三种结构 A 卖跨式 / B 买跨式 / C 不动，按历史 实际/隐含 选边。只记账，不下单。
# 标的等值名义金额（美元）；Deribit BTC 期权 1 张 = 1 BTC，纸面允许小数张
notional_usd = 1000.0
# Deribit 期权吃单手续费：每条腿 0.03% 标的，封顶权利金的 12.5%；滑点按权利金的百分比
fee_pct_underlying = 0.03
fee_cap_pct_premium = 12.5
slippage_pct = 0.5
# 对冲腿（永续）吃单手续费，百分比
hedge_fee_pct = 0.05
# 选边规则 v1（写死在代码里）：同组样本 ≥ min_history 个时，均值 实际/隐含 < short_below → A；> long_above → B；否则 C
short_below = 0.9
long_above = 1.1
# 卖跨式"最大亏损"按标的走出多少个隐含标准差来压力测试
stress_sigmas = 3.0

[options.shock]
# 突发冲击样本（11c，事件类别 ③；desk/options_shock.py）：抽取器吐出的重要事件（地缘 / 监管-ETF-SEC / 交易所被盗 / 宏观意外 / 关税）
# 首次出现就用当下的期权链锁定一个 24 小时样本，锁定记录带 event_status。纸面规则：已结束 → 按历史选边；进行中 / 看不出 → 不动。只记账。
enabled = true
every_min = 5
# 回看多久以前的抽取结果；同一件事 / 同类别在 dedupe_hours 内不重复开样本；新闻超过 max_news_age_h 小时的不开（隐含已不是"刚重新定价"）
lookback_h = 24
dedupe_hours = 24
max_news_age_h = 6

[options.us]
# 美股期权回测口径（options_backtest --market us）：美国居民用不了 Deribit，真钱会在 Robinhood 做 IBIT / SPY / QQQ / 单票期权。
# 手续费：每张合约每次成交（Robinhood 本身 0，但 OCC/交易所/监管费加起来约 $0.03–0.10；其他券商常见 $0.65），取 $0.65 保守
fee_per_contract_usd = 0.65
# 1 张 = 100 股；滑点按权利金百分比（美股期权事件时刻买卖价差比 Deribit 宽）
contract_multiplier = 100
slippage_pct = 1.0

[alpaca]
# 11d 美股期权执行层（desk/alpaca_exec.py；说明见 knowledge/alpaca_exec_README.md）。
# enabled=false：完全不动。enabled=true、live=false：有纸面 key 就发到 Alpaca 纸面账户，否则只演练记账。
# 真钱要 live=true 且其余 8 条门全过（两人批准、近似回测门〔只算事件〕、真实报价门、纸面成绩、1 个仓位、当日止损、开盘），少一条就退回纸面/演练。
enabled = false
live = false
# 单笔最多亏多少美元（张数 = floor(这个 / 每张最大亏损)；不够 1 张就不下）
max_risk_usd = 100.0
# 当天（美东）真钱已实现亏损到这个数就不再开新仓
daily_loss_stop_usd = 100.0
# 真钱前至少要有多少个已结算的事件/突发纸面样本，且按规则选边累计 ≥ 0
paper_events_required = 5
# 铁蝶式翅膀离平值多远（%）
wing_pct = 3.0
# CPI / FOMC / NFP 和非加密突发事件用哪个标的（SPY 或 QQQ）
macro_underlying = "SPY"

[positions]
# 仓位看守（#12）：每隔多少秒读一次账户里的所有仓位（含手动开的），只读、不下单。规则用 python -m desk.positions set 或设置页填。
poll_sec = 30
# 每多少次读取把原始快照落盘一次（有事件时立刻落盘）
flush_every_polls = 10

[headline_shadow]
# 头条动量影子线（只记账、永不下单）：油价相关的重要新闻一出来，按"收到后 delay_sec 秒的链上中间价"记一笔
# 顺着新闻方向的影子单（袭击/供应冲击 → 多；停火/降温 → 空），在 +1h/+4h/+24h 按全额手续费对账。
# 工作日也跑。目的：攒证据回答"追头条到底赚不赚钱"，以及"已结束的事件 vs 进行中的事件"哪种会反转。
enabled = true
instrument = "BRENTOIL"
delay_sec = 120
horizons_h = [1, 4, 24]
# 同一事件（event_id 相同或原句高度相似）在这么多小时内再出现 → 记为"重复"，不算新信息
dedupe_hours = 6
# 回看多久以前的事件（给抽取和链上数据留出延迟）
lookback_h = 48
# 每隔多少分钟扫一次
every_min = 5

[universe]
# 品种扩展（#13，desk/universe.py）：扫描 HIP-3 dex 时的流动性门槛。主 dex 加密永续不进候选（7×24，没有休市结构）。
min_day_ntl_vlm_usd = 200000.0
min_oi_usd = 100000.0
# impactPxs 买卖价之差（bps）上限
max_spread_bps = 20.0
# 候选回测最近多少个周末
weekends = 12

[notify]
# 手机推送（ntfy.sh，免费）：在 .env 里填 NTFY_TOPIC
server = "https://ntfy.sh"
# 每天几点（加州时间）推送当日 PDF
daily_pdf_hour_pt = 7

[agents]
# AI 团队（18 个起步，赛马岗自动增减）。不碰真钱、不改规则；按结果自动奖惩。
enabled = true
member_model = "claude-haiku-4-5-20251001"
lead_model = "claude-sonnet-5-5"
# 算法室两个算法师用最强的模型
algo_model = "claude-opus-5-5"
# 每天几点开会（加州时间），在 7 点日报之前
daily_hour_pt = 6
daily_minute_pt = 30
# 周末加开一次：最早决策时刻前多少分钟
weekend_lead_min = 120
rounds = 2
max_parallel = 6
# 费用封顶（美元）：超了当天/当月不再开会，只做代码审计
budget_day_usd = 4.0
budget_month_usd = 60.0
# 网页"现在开会"按钮的冷却时间
manual_cooldown_min = 30

[pairs]
# 跨 dex 同底层配对真下单（desk/pairs_exec.py）。开关在 data/state/pairs_live.json（默认 off，和 autotrade 的 live.json 分开）。
# 信号 = pairs_lab 的走前选出的变体；两腿 IOC 限价、等名义；只平我们自己记账的数量（reduce-only）。以下全部是保守默认值。
interval = "5m"
lookback_days = 17
warmup_days = 5
# 只做 pairs_lab 里 kind=same 且过流动性门槛的配对；allow 非空时只做列出的 "A|B"（coin 全名，按字典序），如 ["io:SNDK|xyz:SNDK"]
allow = []
max_leg_notional_usd = 100.0
max_concurrent = 1
max_total_gross_usd = 200.0
max_pair_loss_usd = 4.0
daily_loss_stop_usd = 8.0
# 每腿杠杆（代码里再硬封顶 2）
leverage = 2
# 名义不超过盘口第一档深度的这个比例
depth_fraction = 0.10
max_hold_h = 24.0
# 进场 IOC 的滑点上限；平仓/回补从 exit_slippage_bps 起，每重试一次翻倍
slippage_bps = 30.0
exit_slippage_bps = 60.0
# 两腿名义差超过"每腿名义 × 这个比例"就回补多出来的那条腿
net_tolerance_frac = 0.05
unwind_retries = 3
min_balance_usd = 5.0
# 估算手续费（吃单 bps/笔），用于记账盈亏
fee_bps = 9.0
cooldown_min = 30

[account]
# 总账户止损线（desk/account_stop.py）：周末策略 + 跨平台套利的真实已实现盈亏合计亏到这个数，两条线全部停开新仓。
# 解除：python -m desk.account_stop --reset（不会自动切回真下单）
max_loss_usd = 500.0
